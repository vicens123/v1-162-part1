version: "3.8"

services:
  app:
    build: .
    container_name: rag-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/database164
    restart: unless-stopped

  db:
    image: ankane/pgvector
    container_name: pgvector-db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: database164
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_chat_tables.sql:/docker-entrypoint-initdb.d/01_init_chat_tables.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d database164"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: